<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Dashboard</h1>
        <p class="subtitle">Check real-time weather of any city</p>

        <!-- Search Box -->
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <!-- Error Message -->
        <div id="error" class="error"></div>

        <!-- Loading -->
        <div id="loading" class="loading">
            Loading weather...
        </div>

        <!-- Weather Dashboard -->
        <div id="weatherCard" class="weather-card">

            <div class="location">
                <h2 id="cityName">City</h2>
                <p id="country">Country</p>
            </div>

            <div class="weather-main">

                <div class="weather-icon" id="weatherIcon">
                    🌤️
                </div>

                <div>
                    <h2 id="temperature">--°C</h2>
                    <p id="weatherDescription">Weather</p>
                </div>

            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">-- km/h</h3>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feelsLike">--°C</h3>
                </div>

                <div class="detail">
                    <span>🌧️</span>
                    <p>Rain</p>
                    <h3 id="rain">-- mm</h3>
                </div>

            </div>

            <div class="updated">
                Last Updated: <span id="updatedTime">--</span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
